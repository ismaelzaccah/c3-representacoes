function perfOf(pid){

function gauge(pct, pace, label){
  const max = 125, cx = 100, cy = 100, r = 76;
  const ang = v => Math.PI * (1 - Math.min(Math.max(v,0),max)/max);
  const pt = (v,rr) => [cx + rr*Math.cos(ang(v)), cy - rr*Math.sin(ang(v))];
  const arc = (a,b,cls) => { const [x1,y1]=pt(a,r),[x2,y2]=pt(b,r); return `<path class="${cls}" d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}"/>`; };
  const ticks = [0,25,50,75,100,125].map(v=>{ const [x,y]=pt(v,r+15); return `<text class="g-t" x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}">${v}%</text>`; }).join("");
  const [nx,ny] = pt(pct, r-18);
  let pm = ""; if(pace!=null){ const [a1,b1]=pt(pace,r-10),[a2,b2]=pt(pace,r+9); pm = `<line class="g-pace" x1="${a1.toFixed(1)}" y1="${b1.toFixed(1)}" x2="${a2.toFixed(1)}" y2="${b2.toFixed(1)}"/>`; }
  return `<svg class="gauge" viewBox="0 0 200 124" role="img" aria-label="${esc(label)}: ${pct}%">${arc(0,70,"g-bad")}${arc(70,100,"g-warn")}${arc(100,125,"g-ok")}${ticks}${pm}
    <line class="g-needle" x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}"/><circle class="g-hub" cx="${cx}" cy="${cy}" r="6"/><text class="g-val" x="100" y="122">${pct}%</text></svg>`;
}

function saveVisitFields() {
  const visit = S.ci;
  for (const [id, key] of [['visitContact', 'contact'], ['visitNotes', 'obs'], ['visitTask', 'task'], ['visitDue', 'due'], ['visitJustification', 'justification'], ['visitWhy', 'why']]) {
    const input = getElement(id);
    if (input) visit[key] = input.value;
  }
}

function validateVisitPosition(exit) {
  const visit = S.ci;
  const first = !VISITS.some(item => item.p === me().id && item.date === iso(TODAY));
  const last = exit && afterLast(visit.outTime) && getElement('visitLast')?.value === 'sim';
  const unavailable = ['antiga', 'erro'].includes(visit.position);
  if (!VEHICLES[me().id]) return 'Vincule um veículo exclusivo a este promotor antes da visita.';
  if (unavailable && visit.justification.trim().length < 10) return 'Posição antiga ou indisponível. Informe uma justificativa para conferência.';
  if (!unavailable && visit.clientDistance > 70) return 'Distância acima de 70 m do cliente. Confira o endereço cadastrado antes de registrar.';
  if (!unavailable && (first || last) && visit.homeDistance < 500) return 'Primeira ou última visita a menos de 500 m da residência. Registro bloqueado.';
  if (first && !exit && !inFirstWindow(visit.time) && visit.justification.trim().length < 10) return 'Primeira visita fora de 8h–8h20. Justifique para o aviso ao Admin.';
  if (!exit && !me().repeatOk && VISITS.filter(item => item.p === me().id && item.c === visit.client && item.date >= '2026-10-19').length >= 2 && visit.why.trim().length < 10) return 'Informe o motivo da terceira visita ou posterior neste cliente na semana.';
  return '';
}

function handleAdjustedAction(action, element) {
  const visit = S.ci;
  if (visit) saveVisitFields();
  if (action === 'ciStart' || action === 'ciResume') {
    if (!isProm()) return true;
    visitInitAdjusted(action === 'ciStart' ? element.dataset.id : null, action === 'ciResume' ? element.dataset.id : null);
  } else if (action === 'selectVisitCustomer') {
    if (!canAccessCustomer(cli(element.dataset.id))) return true;
    visit.client = element.dataset.id;
    visit.step = 'contexto';
  } else if (action === 'visitReason') {
    saveVisitFields();
    visit.mot.has(element.dataset.v) ? visit.mot.delete(element.dataset.v) : visit.mot.add(element.dataset.v);
  } else if (action === 'confirmVisitEntry') {
    saveVisitFields();
    visit.err = validateVisitPosition(false);
    if (!visit.err) {
      const record = { id: `v${vid++}`, c: visit.client, p: me().id, date: iso(TODAY), tin: visit.time, tout: null, mot: [], contact: '', obs: '', location: visit.position, justification: visit.justification };
      VISITS.push(record);
      visit.visitId = record.id;
      visit.step = 'relatorio';
      if (!inFirstWindow(visit.time)) ALERTS.unshift({ id: `alert-${Date.now()}`, audience: 'admin', kind: 'warn', t: `Hoje ${visit.time}`, txt: `${me().n}: primeira visita fora da janela. ${visit.justification}` });
    }
  } else if (action === 'saveVisitNotes' || action === 'reviewVisitExit') {
    saveVisitFields();
    visit.err = !visit.mot.size ? 'Escolha ao menos um motivo.' : visit.obs.trim().length < 10 ? 'Descreva o que foi tratado com pelo menos dez caracteres.' : '';
    if (!visit.err) {
      const record = VISITS.find(item => item.id === visit.visitId);
      Object.assign(record, { mot: [...visit.mot], contact: visit.contact, obs: visit.obs });
      if (action === 'reviewVisitExit') visit.step = 'checkout';
    }
  } else if (action === 'returnVisitReport') visit.step = 'relatorio';
  else if (action === 'confirmVisitExit') {
    saveVisitFields();
    visit.err = validateVisitPosition(true);
    if (!visit.err && toMin(visit.outTime) < toMin(visit.time)) visit.err = 'A saída precisa ser posterior à entrada.';
    if (!visit.err) {
      const record = VISITS.find(item => item.id === visit.visitId);
      record.tout = visit.outTime;
      record.exitLocation = visit.position;
      record.exitJustification = visit.justification;
      if (visit.task) TASKS.unshift({ id: `task-${Date.now()}`, c: visit.client, p: me().id, text: visit.task, due: visit.due, done: false });
      S.ci = null;
      toast('Visita encerrada na demonstração. Histórico e tarefa atualizados.');
      return true;
    }
  } else if (action === 'ciClose') S.ci = null;
  else if (action === 'newCustomer' || action === 'editCustomer') {
    S.ci = null;
    S.customerEdit = { id: action === 'editCustomer' ? element.dataset.id : null };
    if (S.customerEdit.id && !canAccessCustomer(cli(S.customerEdit.id))) return true;
    S.view = 'clienteNovo';
  } else if (action === 'newTask') {
    extraForm('task', 'Nova tarefa', `<label>Cliente<select class="inp" name="client">${visibleClients().map(customer => `<option value="${customer.id}">${esc(customer.n)}</option>`).join('')}</select></label>${!isProm() ? `<label>Responsável<select class="inp" name="owner">${activeProms().map(person => `<option value="${person.id}">${esc(person.n)}</option>`).join('')}</select></label>` : ''}<label>O que precisa ser feito<textarea class="inp" name="text" required minlength="10"></textarea></label><label>Data<input class="inp" name="due" type="date" value="${daysAhead(7)}" required></label>`);
    return true;
  } else if (action === 'customerNotice') {
    if (isProm()) return true;
    const notice = S.clientNotices[element.dataset.id];
    extraForm(action, 'Aviso interno do cliente', `<label>Texto<textarea class="inp" name="text" required>${esc(notice?.text || '')}</textarea></label><label>Início<input class="inp" name="start" type="date" required value="${notice?.start || iso(TODAY)}"></label><label>Fim<input class="inp" name="end" type="date" required value="${notice?.end || daysAhead(7)}"></label>`, element.dataset.id);
    return true;
  } else if (action === 'campaignFolder') {
    const campaign = CAMPS.find(item => item.id === element.dataset.id);
    if (!campaign.folder) { toast('Folder ainda aguardando anexo.'); return true; }
    S.reportPreview = { title: 'Folder de campanha', html: `<div class="sample-folder"><b>${esc(campaign.n)}</b><p>Folder ilustrativo · material comercial será anexado pela C3.</p></div>` };
  } else if (action === 'campaignAttach') {
    if (isProm()) return true;
    CAMPS.find(item => item.id === element.dataset.id).folder = true;
  } else if (action === 'requestCampaign') {
    extraForm('campaignRequest', 'Solicitar campanha', `<label>Cliente<select class="inp" name="client">${visibleClients().map(customer => `<option value="${customer.id}">${esc(customer.n)}</option>`).join('')}</select></label><label>Fornecedor<select class="inp" name="line">${LINES.map(supplier => `<option value="${supplier.id}">${esc(supplier.n)}</option>`).join('')}</select></label><label>Título<input class="inp" name="title" required></label><label>Descrição<textarea class="inp" name="description" required></textarea></label>`);
    return true;
  } else if (action === 'campaignCancel' || action === 'campaignDecision') {
    extraForm(action, action === 'campaignCancel' ? 'Cancelar campanha' : 'Resposta do fornecedor', `${action === 'campaignDecision' ? '<label>Decisão<select class="inp" name="decision"><option>Aprovada</option><option>Rejeitada</option></select></label>' : ''}<label>Motivo ou observação<textarea class="inp" name="reason" required minlength="10"></textarea></label>`, element.dataset.id);
    return true;
  } else if (action === 'correctFuel') {
    if (!isAdmin()) return true;
    const expense = EXP.find(item => item.id === element.dataset.id);
    extraForm(action, 'Correção de abastecimento', `<p>Valor anterior ${reais(expense.value)}</p><label>Valor corrigido<input class="inp" name="value" type="number" min="0.01" step="0.01" required value="${expense.value}"></label><label>Justificativa<textarea class="inp" name="reason" required minlength="10"></textarea></label>`, expense.id);
    return true;
  } else if (action === 'expNo') {
    if (!isAdmin()) return true;
    extraForm('expenseReject', 'Rejeitar despesa', '<label>Motivo<textarea class="inp" name="reason" required minlength="10"></textarea></label>', element.dataset.id);
    return true;
  } else if (action === 'expOk') {
    if (!isAdmin()) return true;
    EXP.find(item => item.id === element.dataset.id).status = 'Aprovada';
  } else if (action === 'routePreview') {
    S.reportPreview = { title: 'Destino e navegação', html: '<p>Escolher cliente da região → abrir orientação externa no Waze.</p><p>O histórico e os quilômetros do trajeto serão obtidos da Upcar. São fontes distintas de navegação e telemetria.</p>', note: 'Fluxo ilustrativo para validação técnica' };
  } else if (action === 'orderVersion') {
    extraForm(action, 'Nova versão', `<label>Quantidade<input class="inp" type="number" name="quantity" min="6" step="1" value="${S.orders.quantity}" required></label><label>Motivo<textarea class="inp" name="reason" required minlength="10"></textarea></label>`);
    return true;
  } else if (action === 'orderResponse') {
    extraForm(action, 'Resposta do cliente', '<label>Decisão<select class="inp" name="decision"><option>Aprovada</option><option>Alteração solicitada</option><option>Rejeitada</option></select></label><label>Observação<textarea class="inp" name="reason" required minlength="10"></textarea></label><label><input type="checkbox" name="evidence" required> Vincular evidência fictícia a esta versão</label><label>Na rejeição<select class="inp" name="next"><option>Revisar</option><option>Encerrar</option></select></label>');
    return true;
  } else if (action === 'orderReview') S.orders.reviewed = true;
  else if (action === 'orderAuthorize') { if (S.orders.reviewed && S.orders.customer === 'Aprovada') S.orders.authorized = true; }
  else if (action === 'orderSend') { if (S.orders.authorized) S.orders.sent = true; }
  else if (action === 'orderQuote') {
    exportRep('Cotação', ['PRODUTO', 'QTD', 'UNIT', 'TOTAL', 'MULTI'], [['DEMO-W001 · Grupo', S.orders.quantity, '12,345', reais3(S.orders.quantity * 12345 / 1000), 6]], 'pdf');
    return true;
  } else if (action === 'extraClose') { S.extra = null; S.reportPreview = null; }
  else return false;
  render();
  return true;
}

root.addEventListener('change', event => {
  const element = event.target;
  if (!S.ci) return;
  saveVisitFields();
  if (element.id === 'demoPosition') S.ci.position = element.value;
  else if (element.id === 'demoTime') S.ci[S.ci.visitId ? 'outTime' : 'time'] = element.value;
  else if (element.id === 'demoClientDistance') S.ci.clientDistance = Number(element.value);
  else if (element.id === 'demoHomeDistance') S.ci.homeDistance = Number(element.value);

root.addEventListener('submit', event => {
  event.preventDefault();
  const form = event.target;
  const values = new FormData(form);
  if (form.id === 'customerEditForm') {
    const uf = values.get('uf');
    if (isProm() && !me().ufs.includes(uf)) return;
    let customer = S.customerEdit.id ? cli(S.customerEdit.id) : null;
    if (!customer) {
      customer = { id: `new-${Date.now()}`, t: 'Autopeças', lines: {}, seg: {}, p: isProm() ? me().id : 'daysi', xy: [0, 0], numDate: iso(TODAY), last: 0, cnpj: values.get('cnpj') };
      CLIENTS.push(customer);
    }
    Object.assign(customer, { n: values.get('name'), addr: values.get('address'), city: values.get('city'), uf, contactFull: values.get('contact'), contact: values.get('contact'), phone: values.get('phone'), email: values.get('email') });
    S.view = 'cliente'; S.param = customer.id; S.customerEdit = null;
    toast('Cadastro atualizado na demonstração, disponível aos promotores dos estados correspondentes.');
    return;
  }
  if (form.id !== 'extraForm') return;
  const extra = S.extra;
  if (extra.kind === 'customerNotice') {
    if (isProm()) return;
    if (values.get('start') > values.get('end')) { toast('A data final deve ser igual ou posterior à inicial.'); return; }
    S.clientNotices[extra.id] = { text: values.get('text'), start: values.get('start'), end: values.get('end') };
  } else if (extra.kind === 'task') {
    const customer = cli(values.get('client'));
    if (!canAccessCustomer(customer)) return;
    TASKS.unshift({ id: `task-${Date.now()}`, c: customer.id, p: isProm() ? me().id : values.get('owner'), text: values.get('text'), due: values.get('due'), done: false });
  } else if (extra.kind === 'campaignRequest') {
    const customer = cli(values.get('client'));
    if (!canAccessCustomer(customer)) return;
    CAMPS.unshift({ id: `campaign-${Date.now()}`, requester: S.uid, cli: [customer.id], n: values.get('title'), line: values.get('line'), note: values.get('description'), meta: 1, done: 0, unit: 'resultado a definir', ps: isProm() ? [me().id] : PROM.filter(person => person.ufs.includes(customer.uf)).map(person => person.id), byProm: {}, feed: 'prom', decision: 'Solicitada', folder: false, cancelled: false });
  } else if (extra.kind === 'campaignCancel' || extra.kind === 'campaignDecision') {
    const campaign = CAMPS.find(item => item.id === extra.id);
    if (extra.kind === 'campaignCancel') campaign.cancelled = true;
    else campaign.decision = values.get('decision');
  } else if (extra.kind === 'orderVersion') {
    S.orders.history.push(`v${S.orders.version} · ${S.orders.customer} · ${S.orders.authorized ? 'autorização preservada no histórico' : 'substituída'}`);
    Object.assign(S.orders, { version: S.orders.version + 1, quantity: Number(values.get('quantity')), customer: 'Pendente', reviewed: false, authorized: false, evidence: false });
  } else if (extra.kind === 'orderResponse') {
    Object.assign(S.orders, { customer: values.get('decision'), reviewed: false, authorized: false, evidence: true, closed: values.get('decision') === 'Rejeitada' && values.get('next') === 'Encerrar' });
  } else if (extra.kind === 'correctFuel') {
    if (!isAdmin()) return;
    const expense = EXP.find(item => item.id === extra.id);
    S.audit.push({ entity: expense.id, before: expense.value, after: Number(values.get('value')), reason: values.get('reason'), actor: curUser().id });
    expense.value = Number(values.get('value'));
  } else if (extra.kind === 'expenseReject') {
    if (!isAdmin()) return;
    const expense = EXP.find(item => item.id === extra.id);
    expense.status = 'Recusada';
    expense.rejectionReason = values.get('reason');
  }
  S.extra = null;
  toast('Registro de demonstração atualizado.');
});

root.addEventListener('keydown', event => {
  if (event.key === 'Escape' && (S.extra || S.reportPreview)) { S.extra = null; S.reportPreview = null; render(); }
});

function rememberView() {
  if (window.openai?.setWidgetState) {
    window.openai.setWidgetState({
      modelContent: { pessoa: curUser().n, perfil: profName(curUser().profile), tela: S.view },
      privateContent: { uid: S.uid, view: S.view }
    }).catch(() => {});
  }
}
root.addEventListener('change', event => {
  if (event.target.id === 'roleSel') queueMicrotask(rememberView);
});
root.addEventListener('click', event => {
  if (event.target.closest('[data-a="go"],[data-a="cli"]')) queueMicrotask(rememberView);
});


// ---------- eventos ----------
let toastT, recT;
function toast(t){ S.toast=t; S.keepScroll=true; render(); clearTimeout(toastT); toastT=setTimeout(()=>{S.toast=null;root.querySelector(".toast")?.remove();},3600); }
const parseBR = s => +String(s||"").replace(/[^\d,.-]/g,"").replace(/\.(?=\d{3})/g,"").replace(",",".");
root.addEventListener("click", e=>{
  const el = e.target.closest("[data-a]"); if(!el) return;
  if((el.matches(".drawer") || el.matches(".ov")) && e.target.closest("[data-stop]")) return;
  const a = el.dataset.a, ci = S.ci;
  if(el.disabled) return;
  const adminActions = ['userNew','userEdit','userSave','newProfile','perm','notif','expOk','expNo','approve','deny'];
  if(adminActions.includes(a) && !isAdmin()){ toast('Ação reservada ao Admin.'); return; }
  if(['cli','editCustomer'].includes(a) && !canAccessCustomer(cli(el.dataset.id))) return;
  if(['lnSet','lnSeg'].includes(a) && !canAccessCustomer(cli(el.dataset.c))) return;
  if(a==='task' && isProm() && !visibleTasks().some(task=>task.id===el.dataset.id)){ toast('Tarefa de outro responsável.'); return; }
  if(handleAdjustedAction(a, el)) return;
  S.keepScroll = !["go","cli"].includes(a);
  switch(a){
    case "go": S.view = el.dataset.v; S.drawer=null; S.q=""; void 0; break;
    case "cli": S.view="cliente"; S.param=el.dataset.id; S.drawer=null; void 0; break;
    case "more": S.drawer="more"; break;
    case "close": S.drawer=null; break;
    case "alerts": S.alertsOpen=true; break;
    case "closeAlerts": S.alertsOpen=false; break;
    case "line": S.lineOpen = el.dataset.id; break;
    case "lineClose": S.lineOpen = null; break;
    case "approve": case "deny": { const al = ALERTS.find(x=>x.id===el.dataset.id); al.act=false; al.kind=a==="approve"?"ok":"bad"; al.txt += a==="approve"?" Exceção aprovada por Caio.":" Exceção recusada."; toast(a==="approve"?"Exceção aprovada. O promotor recebe a resposta no WhatsApp.":"Exceção recusada."); return; }
    case "toast": toast(el.dataset.t); return;
    case "fT": S.fT = el.dataset.v; break;
    case "task": { const t = TASKS.find(x=>x.id===el.dataset.id); t.done = el.checked; toast(t.done?"Tarefa marcada como feita.":"Tarefa reaberta."); return; }
    case "perm": { const pr = PROFILES.find(x=>x.id===el.dataset.p); pr.v[el.dataset.k] = el.checked; USERS.filter(u=>u.profile===pr.id).forEach(u=>u.perms[el.dataset.k]=el.checked); toast("Modelo “"+pr.n+"” atualizado para todas as pessoas com esse perfil."); return; }
    case "notif": NOTIF[+el.dataset.i][2] = el.checked; toast("Avisos do escritório atualizados."); return;
    case "newProfile": { const n = PROFILES.length-2; PROFILES.push({id:"u"+n, n:"Usuário "+n, v:Object.fromEntries(PERMS.map(p=>[p[0],false]))}); toast("Perfil “Usuário "+n+"” criado. Marque as permissões."); return; }
    case "numSave": {
      if(!canAccessCustomer(cli(getElement('nC').value))){toast('Cliente fora do alcance autorizado.');return;}
      const v = parseBR(getElement("nV").value), es = parseBR(getElement("nE").value), pj = parseBR((getElement("nP")||{}).value);
      const fl = getElement("nFile");
      if(!v){ toast("Informe o valor vendido no mês."); return; }
      const c = getElement("nC").value, l = getElement("nL").value;
      let r = NUMS.find(n=>n.c===c&&n.l===l); if(!r){ r={c,l,meta:Math.round(v*1.3),venda:0,est:0,proj:0}; NUMS.push(r); cli(c).lines[l]=true; }
      r.venda=v; if(es) r.est=es; r.proj = pj || Math.round(v/DAYS_DONE*DAYS_TOTAL/100)*100; cli(c).numDate=iso(TODAY);
      if(fl && fl.files[0]) NFILES.unshift({name:fl.files[0].name, c, who:S.uid, date:iso(TODAY)});
      toast("Números de "+lineN(l)+" salvos para "+cli(c).n+"."); return; }
    case "dlVisits": dlVisits(!!el.dataset.own, el.dataset.fmt); return;
    case "dlNums": dlNums(el.dataset.fmt); return;
    case "dlExp": dlExp(el.dataset.fmt); return;
    case "dlMailing": dlMailing(el.dataset.fmt); return;
    case "dlModel": exportRep("Modelo de números", ["Cliente","Linha","Vendido no mês (R$)","Estoque (R$)","Projeção do mês (R$)","Observação"], (isProm()?regionClients(me()):CLIENTS).flatMap(c=>LINES.filter(l=>l.uf.includes(c.uf)).map(l=>[c.n,l.n,"","","",""])), "xlsx"); return;
    case "dlForm": dlForm(); return;
    case "perfP": S.perfP = el.dataset.id || null; break;
    case "perfMetric": S.perfMetric = el.dataset.v; S.keepScroll = true; break;
    // metas e campanhas
    case "campFeed": {
      const k = CAMPS.find(x=>x.id===el.dataset.id); const inp = getElement("cf-"+k.id); const v = parseBR(inp && inp.value);
      if(!v){ toast("Informe a quantidade."); return; }
      const p = me();
      if(k.feed==="office") k.done = v;
      else if(p) k.byProm[p.id] = (k.byProm[p.id]||0) + v;
      else k.done += v;
      k.upd = iso(TODAY); if(S.ci) S.keepScroll = true;
      const pc = Math.round(campDone(k)/k.meta*100);
      toast(k.n+": "+pc+"% da meta. Falta "+fmtN(Math.max(0,k.meta-campDone(k)))+" "+k.unit+"."); return; }
    case "campNew": {
      const n = getElement("cnN").value.trim(), m = parseBR(getElement("cnM").value);
      if(!n || !m){ toast("Dê um nome e uma meta para a campanha."); return; }
      const ps = [...root.querySelectorAll(".cnP:checked")].map(x=>x.value);
      if(!ps.length){ toast("Marque pelo menos um promotor."); return; }
      const cl = [...getElement("cnC").selectedOptions].map(o=>o.value);
      if(!cl.length){ toast("Escolha onde a campanha acontece."); return; }
      CAMPS.push({decision:"Solicitada",folder:false,cancelled:false,id:"k"+Date.now(), cli:cl, ask:getElement("cnA").value.trim()||"resultado da campanha", n, line:getElement("cnL").value, unit:getElement("cnU").value.trim()||"unidades", meta:m, done:0, ps, byProm:Object.fromEntries(ps.map(x=>[x,0])), feed:"prom", note:"Termina em "+brFull(getElement("cnF").value||"2026-10-31")+"."});
      toast("Campanha criada. Os promotores já veem o velocímetro."); return; }
    // pessoas
    case "userNew": S.userEdit = {id:null, n:"", phone:"", profile:"prom", active:true, ufs:["CE"], v:"CLT", area:"", perms:{...PROFILES.find(x=>x.id==="prom").v}}; break;
    case "userEdit": { const u = USERS.find(x=>x.id===el.dataset.id); const p = u.promId ? prom(u.promId) : null; S.userEdit = {id:u.id, n:u.n, phone:u.phone, profile:u.profile, active:u.active, ufs:p?p.ufs.slice():["CE"], v:p?p.v:"CLT", area:p?p.area:"", repeatOk:!!(p&&p.repeatOk), perms:{...u.perms}}; break; }
    case "userClose": S.userEdit = null; break;
    case "ueUF": { const d = S.userEdit, u = el.dataset.v; d.ufs.includes(u) ? d.ufs.splice(d.ufs.indexOf(u),1) : d.ufs.push(u); break; }
    case "ueV": S.userEdit.v = el.dataset.v; break;
    case "userSave": {
      const d = S.userEdit;
      if(!d.n.trim()){ toast("Informe o nome."); return; }
      if(d.profile==="prom" && !d.ufs.length){ toast("Marque pelo menos um estado."); return; }
      if(d.id===S.uid && !d.active){ toast("Você não pode desativar o próprio acesso."); return; }
      let u = d.id ? USERS.find(x=>x.id===d.id) : null;
      if(!u){ u = {id:"u"+Date.now()}; USERS.push(u); }
      Object.assign(u, {n:d.n.trim(), phone:d.phone, profile:d.profile, active:d.active, perms:{...d.perms}});
      if(d.profile==="prom"){
        let p = u.promId ? prom(u.promId) : null;
        if(!p){ p = {id:u.id, city:"", uf:d.ufs[0]}; PROM.push(p); u.promId = p.id; MONTH_BASE[p.id] = 0; }
        Object.assign(p, {n:u.n, short:p.short||u.n.split(" ")[0], ufs:d.ufs.slice(), uf:d.ufs[0], v:d.v, repeatOk:!!d.repeatOk, area:d.area||"Promotor técnico de vendas e marketing"});
      } else delete u.promId;
      S.userEdit = null;
      toast(d.id ? "Dados de "+u.n+" salvos." : u.n+" adicionado(a). Já aparece em “Ver como”."); return; }
    // despesas
    case "expType": S.expType = el.dataset.v; break;
    case "expSave": {
      if(S.expType==="Combustível"){
        const vehicle = getElement('exVehicle').value;
        const odometerText = getElement('exH').value;
        const odometer = Number(odometerText);
        const date = getElement('exD').value;
        const liters = parseBR(getElement('exL').value);
        if(!VEHICLES[vehicle] || (isProm() && vehicle!==me().id)){toast('Selecione o veículo autorizado.');return;}
        if(!odometerText || odometer<0 || liters<=0){toast('Informe hodômetro e litros positivos.');return;}
        if(date<iso(TODAY) && (isProm() || getElement('exN').value.trim().length<10)){toast('Retroativo exige Escritório ou Admin e justificativa.');return;}
        const known = EXP.filter(item=>item.type==='Combustível' && item.vehicle===vehicle && item.odometer!=null);
        if(known.some(item=>(item.date<=date && item.odometer>odometer)||(item.date>date && item.odometer<odometer))){toast('Hodômetro incompatível com registros vizinhos.');return;}
        S.pendingFuel={vehicle,odometer};
      }
      const v = parseBR(getElement("exV").value);
      if(v<=0){ toast("Informe um valor positivo para a despesa."); return; }
      const lit = getElement("exL"); const cs = getElement("exC"); const f = getElement("exF");
      EXP.unshift({id:"e"+Date.now(), who:meKey(), type:S.expType, value:v, c:cs&&cs.value||null, note:getElement("exN").value, date:getElement("exD").value||iso(TODAY), status:isAdmin()?"Aprovada":"Enviada", liters:lit?parseBR(lit.value)||null:null, receipt:!!(f&&f.files[0])});
      if(S.pendingFuel){Object.assign(EXP[0],S.pendingFuel);S.pendingFuel=null;}
      if(!isAdmin()) ALERTS.unshift({id:"a"+Date.now(), kind:"warn", t:"Hoje "+NOW, txt:whoName(meKey())+" enviou despesa de "+reais(v)+" ("+S.expType+") para aprovação."});
      toast(isAdmin()?"Despesa lançada.":"Despesa enviada para aprovação dos gestores."); return; }
    case "expOk": case "expNo": { const x = EXP.find(y=>y.id===el.dataset.id); x.status = a==="expOk"?"Aprovada":"Recusada"; toast("Despesa "+x.status.toLowerCase()+". "+whoName(x.who)+" recebe o aviso."); return; }
    // trajetos
    case "tripStart": {
      const p = me(); const sel = getElement("tripTo"); const dest = el.dataset.dest || (sel ? sel.value : "casa");
      const last = TRIPS.filter(t=>t.p===p.id && t.date===iso(TODAY)).slice(-1)[0];
      const lastV = VISITS.filter(v=>v.p===p.id && v.date===iso(TODAY)).sort((x,y)=>x.tin.localeCompare(y.tin)).slice(-1)[0];
      const from = lastV ? cli(lastV.c).n : (last ? last.to : "Casa");
      ACTIVE[p.id] = {from, to: dest==="casa" ? "Casa" : dest==="outro" ? (S.tripAddr||"Outro endereço") : cli(dest).n, toCid: (dest!=="casa"&&dest!=="outro") ? dest : null, start:NOW, km:0};
      S.tripTo = "";
      const ck = ACTIVE[p.id].toCid ? campsAt(ACTIVE[p.id].toCid).filter(k=>k.ps.includes(p.id)) : [];
      setTimeout(()=>{ toast(ck.length ? "Você está indo para "+ACTIVE[p.id].to+", que tem campanha de "+ck.map(k=>k.n).join(", ")+". Atualize ao chegar." : "Trajeto iniciado às "+NOW+". O Waze abriu em outra aba; o app mede o caminho."); }, 60);
      return; }
    case "tripEnd": { const p = me(); const x = ACTIVE[p.id]; const km = Math.round((2+Math.random()*6)*10)/10; TRIPS.push({p:p.id, from:x.from, to:x.to, start:x.start, end:NOW, km, date:iso(TODAY)}); delete ACTIVE[p.id]; toast("Trajeto encerrado: "+kmf(km)+"."); return; }
    // dicas e IA
    case "aiAsk": aiAsk(); return;
    case "aiStop": if(aiCtl) aiCtl.abort(); return;
    case "aiSug": aiSug(); return;
    case "tipFilter": S.tipArea = el.dataset.v; break;
    case "tipArea": S.tipNew.area = el.dataset.v; break;
    case "tipLine": { const l = el.dataset.v, arr = S.tipNew.lines; arr.includes(l) ? arr.splice(arr.indexOf(l),1) : arr.push(l); break; }
    case "rec": {
      if(S.rec){ clearInterval(recT); S.tipNew.file = "Gravação de "+S.rec.sec+"s"; S.rec = null; toast("Áudio gravado. No sistema final, a transcrição aparece sozinha; aqui, escreva o resumo."); return; }
      S.rec = {sec:0}; recT = setInterval(()=>{ if(!S.rec) return clearInterval(recT); S.rec.sec++; const b = root.querySelector('[data-a="rec"]'); if(b) b.innerHTML = '<span class="pulse"></span> Gravando '+S.rec.sec+'s · toque para parar'; }, 1000); break; }
    case "tipSave": {
      const txt = (getElement("tipT")||{}).value || S.tipNew.text;
      if(txt.trim().length < 15){ toast("Escreva a dica com pelo menos uma frase."); return; }
      const who = isProm() ? me() : null;
      TIPS.unshift({id:"d"+Date.now(), p: who ? who.id : meKey(), date:iso(TODAY), kind:S.tipNew.file?"audio":"texto", dur:S.tipNew.file?S.tipNew.file.replace(/\D/g,"")+"s":"", area:S.tipNew.area, lines:S.tipNew.lines.slice(), uf: who ? who.uf : "CE", text:txt.trim()});
      S.tipNew = {area:"Comercial", lines:[], text:"", file:""};
      toast("Dica salva. Ela já entra nas respostas da IA para toda a equipe."); return; }
    case "lnSet": { const c = cli(el.dataset.c), l = el.dataset.l; c.lines[l] = el.dataset.v==="1"; c.seg = c.seg || {}; if(!c.lines[l]) c.seg[l] = []; S.keepScroll = true; render(); toast(lineN(l)+(c.lines[l]?": trabalha. Marque o segmento.":": não trabalha.")+" Salvo."); return; }
    case "lnSeg": { const c = cli(el.dataset.c), l = el.dataset.l, x = el.dataset.s; c.seg = c.seg || {}; const a = c.seg[l] = c.seg[l] || []; a.includes(x) ? a.splice(a.indexOf(x),1) : a.push(x); S.keepScroll = true; render(); toast(lineN(l)+" · "+(a.join(", ")||"sem segmento")+". Salvo."); return; }

  }
  render();
});
root.addEventListener("change", e=>{
  const t = e.target;
  if(t.id==="roleSel"){ S.extra=null; S.reportPreview=null; S.lineOpen=null; S.uid = t.value; S.view = nav()[0][0]; S.userEdit=null; S.ci=null; S.alertsOpen=false; S.fP=""; S.fUF=""; S.fE=""; S.aiOut=""; S.sugOut=""; render(); return; }
  if(t.id==="fUF"){ S.fUF=t.value; render(); return; }
  if(t.id==="fP"){ S.fP=t.value; render(); return; }
  if(t.id==="ueP" && S.userEdit){ S.userEdit.profile = t.value; S.userEdit.perms = {...PROFILES.find(x=>x.id===t.value).v}; S.keepScroll=true; render(); return; }
  if(t.id==="ueAct" && S.userEdit){ S.userEdit.active = t.checked; return; }
  if(t.id==="ueRep" && S.userEdit){ S.userEdit.repeatOk = t.checked; return; }
  if(t.dataset.uep && S.userEdit){ S.userEdit.perms[t.dataset.uep] = t.checked; return; }
  if(t.id==="fE"){ S.fE=t.value; S.keepScroll=true; render(); return; }
  if(t.id==="tripTo"){ S.tripTo=t.value; S.keepScroll=true; render(); return; }
  if(t.dataset.r && isAdmin()){ RULES[t.dataset.r] = t.type==="checkbox" ? t.checked : t.type==="number" ? +t.value : t.value; if(t.dataset.r==="econFloor"){ S.keepScroll = true; render(); } toast("Regra atualizada."); return; }
  if(t.id==="ciF" && t.files[0]){ S.ci.photo = t.files[0].name; return; }
  if(t.id==="tipAudio" && t.files[0]){ S.tipNew.file = t.files[0].name; S.tipNew.text = (getElement("tipT")||{}).value||""; S.keepScroll=true; render(); return; }
  if(t.id==="nFile" && t.files[0]){ toast("Arquivo “"+t.files[0].name+"” anexado. Agora digite os números e envie."); return; }
});
root.addEventListener("input", e=>{
  const t = e.target;
  if(t.id==="qCli"){ S.q=t.value; getElement("cliRows").innerHTML = cliRows(filterCli()); return; }
  if(t.id==="ciQ"){ S.ci.q=t.value; const qt=t.value.trim().toLowerCase(); getElement("ciList").innerHTML = placeList(qt?S.ci.near.filter(n=>n.name.toLowerCase().includes(qt)):S.ci.near); return; }
  if(t.id==="aiQ"){ S.aiAsk=t.value; return; }
  if(t.id==="ueN" && S.userEdit){ S.userEdit.n=t.value; return; }
  if(t.id==="ueW" && S.userEdit){ S.userEdit.phone=t.value; return; }
  if(t.id==="ueA" && S.userEdit){ S.userEdit.area=t.value; return; }
  if(t.id==="tipT"){ S.tipNew.text=t.value; return; }
  if(t.id==="tripAddr"){ S.tripAddr=t.value; const g=getElement("tripGo"); if(g) g.href = wazeUrl(t.value||me().city); return; }
  if(t.dataset.f && S.ci){ const f=t.dataset.f; if(f==="pname") S.ci.place.name=t.value; else if(f==="paddr") S.ci.place.addr=t.value; else if(f==="pphone") S.ci.place.phone=t.value; else if(f.startsWith("p") && ["pwhats","pcontact","pcargo","pemail"].includes(f)) S.ci.place[f.slice(1)]=t.value; else S.ci[f]=t.value; }
  if(t.dataset.mail && S.ci){ S.ci.mail[t.dataset.mail] = t.value; }
});
root.addEventListener("keydown", e=>{ if(e.key==="Escape" && (S.ci||S.drawer||S.alertsOpen||S.lineOpen||S.userEdit)){ S.ci=null; S.drawer=null; S.alertsOpen=false; S.lineOpen=null; S.userEdit=null; render(); } });
const remembered = window.openai?.widgetState?.privateContent || window.openai?.widgetState || {};
if(USERS.some(user=>user.id===remembered.uid && user.active)){
  S.uid=remembered.uid;
  S.view=nav().some(item=>item[0]===remembered.view)?remembered.view:nav()[0][0];
}
render();
})();

</script>
